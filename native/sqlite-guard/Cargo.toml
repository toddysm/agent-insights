[package]
name = "agent-insights-sqlite-guard"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
description = "Guarded in-place SQLite source reads for Agent Insights"

[features]
qualification-hooks = []

[dependencies]
libsqlite3-sys = { version = "=0.39.1", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
base64 = "=0.22.1"
sha2 = "=0.10.9"
ryu-js = "=1.0.2"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "=3.27.0"
