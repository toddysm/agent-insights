---
name: Native guard and helper checks

"on":
  pull_request:
    paths:
      - "native/sqlite-guard/**"
      - "scripts/*native*"
      - "src/native/**"
      - "src/runtime/native-helper.ts"
      - "tests/native-artifacts.test.ts"
      - "package*.json"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/native-guard.yml"
  push:
    branches: [main]
    paths:
      - "native/sqlite-guard/**"
      - "scripts/*native*"
      - "src/native/**"
      - "src/runtime/native-helper.ts"
      - "tests/native-artifacts.test.ts"
      - "package*.json"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/native-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            host: aarch64-apple-darwin
          - os: macos-15-intel
            host: x86_64-apple-darwin
          - os: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
          - os: windows-2025
            host: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned native toolchain
        run: >
          rustup toolchain install 1.91.0 --profile minimal
          --component rustfmt --component clippy
      # actions/setup-node v7.1.0; Node runs packaging and owned synthetic qualification.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Verify native host architecture
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: |
          rustc --version --verbose | grep -Fx "host: $EXPECTED_HOST"
      - run: cargo fmt --manifest-path native/sqlite-guard/Cargo.toml --check
      - run: >
          cargo clippy --locked --manifest-path native/sqlite-guard/Cargo.toml
          --all-targets --all-features -- -D warnings
      - name: Test production guard build
        run: cargo test --locked --manifest-path native/sqlite-guard/Cargo.toml
      - name: Test qualification hooks and non-serving qualification builds
        run: >
          cargo test --locked --manifest-path native/sqlite-guard/Cargo.toml
          --features qualification-hooks
      - name: Qualify optimized helper processes
        run: >
          cargo test --locked --manifest-path native/sqlite-guard/Cargo.toml
          --release
      - name: Check private native documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >
          cargo doc --locked --manifest-path native/sqlite-guard/Cargo.toml
          --no-deps --document-private-items
      - run: npm ci --ignore-scripts
      - run: npm run test:native-artifacts
      - name: Package and qualify the exact native candidate
        run: npm run package:native
      - name: Explicitly prepare the verified candidate
        run: npm run prepare:native -- --candidate
      - name: Qualify the exact installed bytes and preparation lifecycle
        run: npm run qualify:native
      # actions/upload-artifact v7.0.2; retained CI candidates are not a public release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-candidate-${{ matrix.host }}-${{ github.sha }}
          path: |
            .build/native-candidates/${{ matrix.host }}/
            .build/native-trust/${{ matrix.host }}.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
