name: Design mockups

on:
  pull_request:
    paths:
      - "design/session-insights/**"
      - ".github/workflows/design-mockups.yml"
  push:
    branches: [main]
    paths:
      - "design/session-insights/**"
      - ".github/workflows/design-mockups.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-mockups-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: design/session-insights
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: design/session-insights/package-lock.json
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Install test browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Validate the offline walkthrough
        run: npm test
      - name: Upload synthetic walkthrough evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: design-mockup-browser-results
          path: |
            design/session-insights/playwright-report/
            design/session-insights/test-results/
          retention-days: 7
