---
name: Application validation

"on":
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/prepare-copilot-qualification.mjs"
      - "package*.json"
      - ".npmrc"
      - "tsconfig.json"
      - "docs/evidence-contracts.md"
      - "docs/local-runtime.md"
      - "playwright.config.mjs"
      - "README.md"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/prepare-copilot-qualification.mjs"
      - "package*.json"
      - ".npmrc"
      - "tsconfig.json"
      - "docs/evidence-contracts.md"
      - "docs/local-runtime.md"
      - "playwright.config.mjs"
      - "README.md"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Prepare checksum-pinned Copilot test runtime
        run: node scripts/prepare-copilot-qualification.mjs
      - name: Qualify memory-only Copilot sessions with a synthetic local model
        run: npm run test:copilot
      - name: Remove the owned qualification runtime
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { realpath, rm } from "node:fs/promises";
          import path from "node:path";
          const root = process.env.COPILOT_QUALIFICATION_ROOT;
          if (root) {
            const parent = await realpath(path.dirname(root));
            assert.equal(parent, await realpath(process.env.RUNNER_TEMP));
            assert.ok(path.basename(root).startsWith("agent-insights-qualified-"));
            await rm(root, { recursive: true, force: true });
          }
          NODE
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
